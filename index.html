<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tango Puzzle Builder and Solver</title>
<style>
 :root{--cell:64;--dot:20}
 html{height:100%;overflow:hidden}
 body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:1.2rem;line-height:2rem;margin:0;display:grid;grid-template-rows:minmax(0,1fr) auto;width:100%;height:100vh;height:100dvh;overflow:hidden;}
 .surround{box-sizing:border-box;padding:20px;width:100%;max-width:500px;margin:0 auto;min-height:0;display:grid;grid-template-rows:minmax(0,2fr) auto auto minmax(0,1fr);gap:0.75rem;}
 .board-area{min-width:0;min-height:0;display:grid;place-items:center;padding:4px;}
 #board{background:#fff;box-shadow:0 0 0 4px #000;cursor:pointer;width:auto;height:auto;min-width:0;min-height:0;max-width:100%;max-height:100%;}
 #side{display:contents;}
 .tabs{display:flex;border-bottom:2px solid #000;}
 .tab-btn{flex:1;padding:0.55rem 0;text-align:center;border:1px solid #000;border-bottom:none;cursor:pointer;font-weight:600;background:#eaeaea;}
 .tab-btn.active{background:#fff;}
 .tab-content{display:none;flex-direction:column;gap:1rem;}
 .tab-content.active{display:flex;}
 #solveTab.active{display:contents;}
 #buildTab{grid-row:3 / 5;min-height:0;}
 .solve-controls{display:flex;flex-direction:column;gap:0.5rem;}
 .animation-controls{display:flex;align-items:center;gap:0.75rem;}
 .animation-controls label{white-space:nowrap;}
 #animationSpeed{width:auto;font:inherit;}
 .solve-buttons{display:flex;gap:0.5rem;}
 .solve-buttons button{flex:1;}
 button{padding:0.45rem 0.9rem;font:inherit;border:1px solid #000;border-radius:4px;background:#f0f0f0;cursor:pointer;font-weight:600;}
 button:disabled{opacity:.5;cursor:not-allowed;}
 #status,#buildStatus{font-weight:600;min-height:1.4rem;}
 #status{height:4rem;overflow:hidden;}
 input[type="number"],select{width:4rem;font-size:2.5rem;padding:0.25rem;text-align:center;}
 label.size{display:flex;align-items:center;gap:0.3rem;}
 #strategySelect{width:100%;font:inherit;text-align:left;box-sizing:border-box;}
 #timer{display:flex;flex-direction:column;gap:0.5rem;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;}
 #timer:focus-visible{outline:2px solid #000;outline-offset:2px;}
 .solve-result{display:flex;flex-wrap:wrap;column-gap:1rem;flex-shrink:0;}
 #footer{box-sizing:border-box;width:100%;background:#f0f0f0;text-align:center;padding:0.75rem 1rem;font-size:1rem;line-height:1.5rem;}
 @media(max-width:600px){
   body{font-size:1rem;line-height:1.5rem;}
   .surround{padding:12px;gap:0.5rem;}
   #status{height:3rem;}
   label.size select{font-size:1.5rem;}
 }
</style>
</head>
<body>
  <div class="surround">
    <div class="board-area"><canvas id="board"></canvas></div>
    <div id="side">
      <div class="tabs">
        <div class="tab-btn active" data-tab="solveTab">Solve</div>
        <div class="tab-btn" data-tab="buildTab">Build</div>
      </div>

      <!-- Solve -->
      <div id="solveTab" class="tab-content active">
        <div class="solve-controls">
          <div class="animation-controls">
            <label><input type="checkbox" id="animateChk"> Animate search</label>
            <select id="animationSpeed" aria-label="Animation speed">
              <option value="1000">Slow</option>
              <option value="500">Medium</option>
              <option value="200" selected>Fast</option>
            </select>
          </div>
          <label for="strategySelect">Strategy
            <select id="strategySelect">
              <option value="backtracking">Backtracking</option>
              <option value="propagation">Constraint propagation + backtracking</option>
            </select>
          </label>
          <div class="solve-buttons">
            <button id="startBtn">Start</button>
            <button id="clearSolutionBtn">Clear</button>
          </div>
          <div id="status" role="status">Idle</div>
        </div>
        <div id="timer" tabindex="0" role="region" aria-label="Solve history" title="A step is one candidate symbol checked against the puzzle rules."></div>
      </div>

      <!-- Build -->
      <div id="buildTab" class="tab-content">
        <div style="display:flex;gap:0.8rem;flex-wrap:wrap">
          <label class="size">Cols
            <select id="colsInp">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6" selected>6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
            </select>
          </label>
          <label class="size">Rows
            <select id="rowsInp">
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6" selected>6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
            </select>
          </label>
        </div>
        <button id="clearBtn">Clear</button>
        <div id="buildStatus">build mode ready</div>
      </div>
    </div>
  </div>
<script>
/* Tango Puzzle Solver */
// GRID SIZE & CANVAS
const colsInp = document.getElementById('colsInp'), rowsInp = document.getElementById('rowsInp');
let COLS = parseInt(colsInp.value, 10), ROWS = parseInt(rowsInp.value, 10);
const CELL = 64;
const canvas = document.getElementById('board'), ctx = canvas.getContext('2d');
ctx.lineCap = 'round';
function resizeCanvas(){ canvas.width = COLS * CELL; canvas.height = ROWS * CELL; }
resizeCanvas();

// PUZZLE STATE
let eqEdges = new Set(), diffEdges = new Set();
let solution = null;
let animationMove = null;
let cellClues = new Array(ROWS * COLS).fill(-1);

// HELPERS
function edgeKey(r1, c1, r2, c2){ return `${r1},${c1}|${r2},${c2}`; }
function hasEq(r1, c1, r2, c2){ const k = edgeKey(r1,c1,r2,c2), rk = edgeKey(r2,c2,r1,c1); return eqEdges.has(k)||eqEdges.has(rk); }
function hasDiff(r1, c1, r2, c2){ const k = edgeKey(r1,c1,r2,c2), rk = edgeKey(r2,c2,r1,c1); return diffEdges.has(k)||diffEdges.has(rk); }

// DRAWING
function drawBoard(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // draw cell clues (blank:-1, sun:1, moon:0)
  ctx.font = `${CELL/2}px sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(let r=0; r<ROWS; r++){
    for(let c=0; c<COLS; c++){
      const pos = r*COLS + c;
      const val = cellClues[pos];
      if(val !== -1){
        // grey background for initial clue
        ctx.fillStyle = '#888';
        ctx.fillRect(c*CELL, r*CELL, CELL, CELL);
        // draw symbol: yellow sun, white moon
        const sym = val===1 ? '☀' : '☾';
        ctx.fillStyle = val===1 ? 'yellow' : '#fff';
        ctx.fillText(sym, c*CELL + CELL/2, r*CELL + CELL/2);
      }
    }
  }
  // draw solution for empty cells only
  if(solution){
    // use same font/align as clues
    ctx.font = `${CELL/2}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for(let r=0; r<ROWS; r++){
      for(let c=0; c<COLS; c++){
        const pos = r * COLS + c;
        const v = solution[pos];
        if(cellClues[pos] === -1 && v !== -1){
          // place symbol on white background
          const sym = v===1 ? '☀' : '☾';
          ctx.fillStyle = v===1 ? 'yellow' : '#000';
          ctx.fillText(sym, c*CELL + CELL/2, r*CELL + CELL/2);
        }
      }
    }
  }
  // grid lines
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
  for(let i=0; i<=COLS; i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,ROWS*CELL); ctx.stroke(); }
  for(let j=0; j<=ROWS; j++){ ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(COLS*CELL,j*CELL); ctx.stroke(); }
  // clues
  ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `${CELL/2}px sans-serif`;
  eqEdges.forEach(k=>{ const [[r1,c1],[r2,c2]] = k.split('|').map(s=>s.split(',').map(Number)); drawClue('=',r1,c1,r2,c2); });
  diffEdges.forEach(k=>{ const [[r1,c1],[r2,c2]] = k.split('|').map(s=>s.split(',').map(Number)); drawClue('×',r1,c1,r2,c2); });
  if(animationMove){
    const {pos,kind}=animationMove;
    ctx.strokeStyle=kind==='undo'?'#c62828':kind==='guess'?'#a65d00':'#16733a';
    ctx.lineWidth=4;
    ctx.strokeRect((pos%COLS)*CELL+3,Math.floor(pos/COLS)*CELL+3,CELL-6,CELL-6);
  }
}
function drawClue(sym, r1, c1, r2, c2){
  let x,y;
  if(r1===r2){ y=(r1+0.5)*CELL; x=(Math.max(c1,c2))*CELL; }
  else { x=(c1+0.5)*CELL; y=(Math.max(r1,r2))*CELL; }
  ctx.fillText(sym, x, y);
}

// BUILD MODE
canvas.addEventListener('click', e => {
  if(!document.getElementById('buildTab').classList.contains('active')) return;
  const rect = canvas.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  const cellWidth=rect.width/COLS, cellHeight=rect.height/ROWS;
  const c=Math.floor(x/cellWidth), r=Math.floor(y/(cellHeight)); if(r<0||r>=ROWS||c<0||c>=COLS) return;
  const gx=x%cellWidth, gy=y%cellHeight, tol=cellWidth/6;
  const L=(gx<tol), R=(cellWidth-gx)<tol, T=gy<tol, B=(cellHeight-gy)<tol;
  if(!(L||R||T||B)){
    const pos = r * COLS + c;
    // cycle: blank(-1) -> sun(1) -> moon(0) -> blank
    cellClues[pos] = cellClues[pos] === -1 ? 1 : (cellClues[pos] === 1 ? 0 : -1);
    clearSolution();
    const status = document.getElementById('buildStatus');
    if(cellClues[pos] === 1) status.textContent = 'Placed sun';
    else if(cellClues[pos] === 0) status.textContent = 'Placed moon';
    else status.textContent = 'Cleared cell';
    return;
  }
  // edge click: toggle clue = or ×
  let r2, c2;
  if(gx < tol && c > 0)      { r2 = r; c2 = c - 1; }
  else if(CELL - gx < tol && c < COLS - 1) { r2 = r; c2 = c + 1; }
  else if(gy < tol && r > 0) { r2 = r - 1; c2 = c; }
  else if(CELL - gy < tol && r < ROWS - 1) { r2 = r + 1; c2 = c; }
  else return;
  const k = edgeKey(r, c, r2, c2);
  if(hasEq(r, c, r2, c2)){
    eqEdges.delete(k); eqEdges.delete(edgeKey(r2,c2,r,c));
    diffEdges.add(k);
  } else if(hasDiff(r, c, r2, c2)){
    diffEdges.delete(k); diffEdges.delete(edgeKey(r2,c2,r,c));
  } else {
    eqEdges.add(k);
  }
  clearSolution();
  document.getElementById('buildStatus').textContent = 'Clue toggled';
});

// SOLVER
let topologyCache=null;
function createRules(assign){
  if(!topologyCache||topologyCache.rows!==ROWS||topologyCache.cols!==COLS){
    const cells=Array.from({length:ROWS*COLS},(_,pos)=>{
      const r=Math.floor(pos/COLS), c=pos%COLS;
      const triples=[];
      for(const [coordinate,length,stride] of [[c,COLS,1],[r,ROWS,COLS]]){
        for(let start=Math.max(0,coordinate-2);start<=Math.min(coordinate,length-3);start++){
          const pair=[];
          for(let i=0;i<3;i++){
            const other=pos+(start+i-coordinate)*stride;
            if(other!==pos) pair.push(other);
          }
          triples.push(pair);
        }
      }
      return {r,c,triples};
    });
    topologyCache={rows:ROWS,cols:COLS,cells};
  }
  const edges=Array.from({length:assign.length},()=>[]);
  for(const [collection,relation] of [[eqEdges,0],[diffEdges,1]]){
    for(const key of collection){
      const [a,b]=key.split('|').map(cell=>{
        const [r,c]=cell.split(',').map(Number);
        return r*COLS+c;
      });
      edges[a].push([b,relation]);
      edges[b].push([a,relation]);
    }
  }
  const rowCounts=new Array(ROWS*2).fill(0), colCounts=new Array(COLS*2).fill(0);
  for(let pos=0;pos<assign.length;pos++){
    const value=assign[pos];
    if(value===-1) continue;
    const {r,c}=topologyCache.cells[pos];
    rowCounts[2*r+value]++;
    colCounts[2*c+value]++;
  }
  return {cells:topologyCache.cells,edges,rowCounts,colCounts};
}

function valid(assign, pos, val, rules=createRules(assign)){
  const {r,c,triples}=rules.cells[pos];
  const previous=assign[pos];
  for(let value=0;value<=1;value++){
    const change=(val===value?1:0)-(previous===value?1:0);
    if(rules.rowCounts[2*r+value]+change>COLS/2||
       rules.colCounts[2*c+value]+change>ROWS/2) return false;
  }
  for(const [a,b] of triples){
    if(assign[a]===val&&assign[b]===val) return false;
  }
  for(const [other,relation] of rules.edges[pos]){
    if(assign[other]!==-1&&(assign[other]^val)!==relation) return false;
  }
  return true;
}

function setValue(assign, pos, value, rules){
  const previous=assign[pos];
  const {r,c}=rules.cells[pos];
  if(previous!==-1){
    rules.rowCounts[2*r+previous]--;
    rules.colCounts[2*c+previous]--;
  }
  assign[pos]=value;
  if(value!==-1){
    rules.rowCounts[2*r+value]++;
    rules.colCounts[2*c+value]++;
  }
}

function recordPlacement(trace, pos, value, kind){
  trace.events.push({pos,value,kind});
  trace.trail.push(pos);
}

function rewindTrace(trace, checkpoint){
  while(trace.trail.length>checkpoint){
    trace.events.push({pos:trace.trail.pop(),value:-1,kind:'undo'});
  }
}

function solveRec(assign, stats, pos=0, rules=createRules(assign), trace=null){
  while(pos<assign.length&&assign[pos]!==-1) pos++;
  if(pos===assign.length) return assign;
  for(let value=0;value<=1;value++){
    stats.steps++;
    if(!valid(assign,pos,value,rules)) continue;
    stats.guesses++;
    const checkpoint=trace?trace.trail.length:0;
    setValue(assign,pos,value,rules);
    if(trace) recordPlacement(trace,pos,value,'guess');
    const result=solveRec(assign,stats,pos+1,rules,trace);
    if(result) return result;
    stats.backtracks++;
    setValue(assign,pos,-1,rules);
    if(trace) rewindTrace(trace,checkpoint);
  }
  return null;
}

// Each supported row or column fits in a small integer mask.
const patternMaskCache=new Map();
function linePatternMasks(length){
  if(patternMaskCache.has(length)) return patternMaskCache.get(length);
  const patterns=[], fullMask=(1<<length)-1;
  for(let pattern=0;pattern<=fullMask;pattern++){
    const zeros=fullMask^pattern;
    if((pattern&(pattern>>1)&(pattern>>2))||(zeros&(zeros>>1)&(zeros>>2))) continue;
    let ones=0;
    for(let bits=pattern;bits;bits&=bits-1) ones++;
    if(ones===length/2) patterns.push(pattern);
  }
  patternMaskCache.set(length,patterns);
  return patterns;
}

function puzzleLines(){
  const equalMasks=new Array(ROWS+COLS).fill(0), differentMasks=new Array(ROWS+COLS).fill(0);
  // Compile actual clue edges once, instead of looking up every possible edge.
  for(const [edges,masks] of [[eqEdges,equalMasks],[diffEdges,differentMasks]]){
    for(const key of edges){
      const [[r1,c1],[r2,c2]]=key.split('|').map(cell=>cell.split(',').map(Number));
      if(r1===r2) masks[r1]|=1<<Math.min(c1,c2);
      else masks[ROWS+c1]|=1<<Math.min(r1,r2);
    }
  }
  const lines=[];
  function addLine(positions){
    const id=lines.length, equalMask=equalMasks[id], differentMask=differentMasks[id];
    const patterns=linePatternMasks(positions.length).filter(pattern=>{
      const changes=pattern^(pattern>>1);
      return (changes&equalMask)===0&&(changes&differentMask)===differentMask;
    });
    lines.push({positions,patterns,fullMask:(1<<positions.length)-1});
  }
  for(let r=0;r<ROWS;r++) addLine(Array.from({length:COLS},(_,c)=>r*COLS+c));
  for(let c=0;c<COLS;c++) addLine(Array.from({length:ROWS},(_,r)=>r*COLS+c));
  return lines;
}

function lineSupport(assign, line){
  const {positions,patterns,fullMask}=line;
  let knownMask=0, valueMask=0;
  for(let i=0;i<positions.length;i++){
    const value=assign[positions[i]];
    if(value===-1) continue;
    knownMask|=1<<i;
    valueMask|=value<<i;
  }
  // Include every assigned symbol so reuse is safe after a branch is abandoned.
  if(line.knownMask!==knownMask||line.valueMask!==valueMask){
    let zeros=0, ones=0;
    for(const pattern of patterns){
      if((pattern&knownMask)!==valueMask) continue;
      zeros|=fullMask^pattern;
      ones|=pattern;
    }
    line.knownMask=knownMask;
    line.valueMask=valueMask;
    line.zeros=zeros;
    line.ones=ones;
  }
  return (line.zeros|line.ones)!==0;
}

function solveWithPropagation(assign, stats, lines, dirtyLines=null, trace=null){
  const queue=dirtyLines?dirtyLines.slice():Array.from({length:lines.length},(_,i)=>i);
  const queued=new Uint8Array(lines.length);
  for(const id of queue) queued[id]=1;
  for(let head=0;head<queue.length;head++){
    const id=queue[head], line=lines[id];
    queued[id]=0;
    if(!lineSupport(assign,line)) return null;
    for(let i=0;i<line.positions.length;i++){
      const pos=line.positions[i];
      if(assign[pos]!==-1) continue;
      // Check both candidate symbols using the line's complete valid patterns.
      stats.steps+=2;
      const mask=((line.zeros>>i)&1)|(((line.ones>>i)&1)<<1);
      if(mask===3) continue;
      assign[pos]=mask===1?0:1;
      stats.forcedPlacements++;
      if(trace) recordPlacement(trace,pos,assign[pos],'forced');
      // All patterns already agree on this value in the current line. Only the
      // intersecting line needs to be reconsidered as a result of the placement.
      const crossing=id<ROWS?ROWS+pos%COLS:Math.floor(pos/COLS);
      if(!queued[crossing]){
        queued[crossing]=1;
        queue.push(crossing);
      }
    }
  }
  const next=assign.indexOf(-1);
  if(next===-1) return assign;
  // At this fixed point every unfilled cell has both candidates remaining.
  const affected=[Math.floor(next/COLS),ROWS+next%COLS];
  for(let value=0;value<=1;value++){
    stats.guesses++;
    const checkpoint=trace?trace.trail.length:0;
    const branch=assign.slice();
    branch[next]=value;
    if(trace) recordPlacement(trace,next,value,'guess');
    const result=solveWithPropagation(branch,stats,lines,affected,trace);
    if(result) return result;
    stats.backtracks++;
    if(trace) rewindTrace(trace,checkpoint);
  }
  return null;
}

function solvePuzzle(strategy, events=null){
  const stats={steps:0,forcedPlacements:0,guesses:0,backtracks:0};
  const assign=cellClues.slice();
  const trace=events?{events,trail:[]}:null;
  if(ROWS%2!==0||COLS%2!==0) return {solution:null,...stats};
  if(strategy==='propagation'){
    // Pattern filtering validates the initial clues as well as deductions.
    const solved=solveWithPropagation(assign,stats,puzzleLines(),null,trace);
    if(!solved&&trace) rewindTrace(trace,0);
    return {solution:solved,...stats};
  }
  const rules=createRules(assign);
  for(let pos=0;pos<assign.length;pos++){
    if(assign[pos]!==-1&&!valid(assign,pos,assign[pos],rules)) return {solution:null,...stats};
  }
  return {solution:solveRec(assign,stats,0,rules,trace),...stats};
}

// UI
const startBtn = document.getElementById('startBtn'), statusEl = document.getElementById('status'), timerEl = document.getElementById('timer'), animateChk = document.getElementById('animateChk');
const strategySelect = document.getElementById('strategySelect');
const animationSpeed = document.getElementById('animationSpeed');
let runId=0;
let pendingTimers=new Set();
function schedule(callback, delay){
  const timer=setTimeout(()=>{
    pendingTimers.delete(timer);
    callback();
  },delay);
  pendingTimers.add(timer);
}
function finishSolve(solved=true){
  statusEl.textContent=solved?'✅ Solved':ROWS%2||COLS%2
    ? 'No solution: rows and columns must both be even.'
    : 'No solution';
  startBtn.disabled=false;
  strategySelect.disabled=false;
}
function clearSolution(){
  runId++;
  pendingTimers.forEach(timer=>clearTimeout(timer));
  pendingTimers.clear();
  solution=null;
  animationMove=null;
  statusEl.textContent='Idle';
  startBtn.disabled=false;
  strategySelect.disabled=false;
  drawBoard();
}
startBtn.addEventListener('click', () => {
  clearSolution();
  const currentRun=runId;
  const strategy=strategySelect.value;
  const strategyName=strategySelect.selectedOptions[0].textContent;
  const animate=animateChk.checked;
  statusEl.textContent='Solving...';
  startBtn.disabled=true;
  strategySelect.disabled=true;
  schedule(() => {
    if(currentRun!==runId) return;
    const events=animate?[]:null;
    const t0=performance.now();
    const result=solvePuzzle(strategy,events);
    const dt=(performance.now()-t0)/1000;
    const entry=document.createElement('div');
    entry.className='solve-result';
    const metrics=[
      [`Time: ${dt.toFixed(3)} s`, 'Time spent solving, excluding animation.'],
      [`Steps: ${result.steps}`, 'Candidate symbols checked against the rules.'],
      [`Strategy: ${strategyName}`, 'Strategy used for this run.'],
      [`Forced placements: ${result.forcedPlacements}`, 'Cells filled by propagation with only one remaining candidate.'],
      [`Guesses: ${result.guesses}`, 'Trial placements made by search, including failed branches.'],
      [`Backtracks: ${result.backtracks}`, 'Trial branches abandoned after failing to find a solution.']
    ];
    for(const [text,description] of metrics){
      const item=document.createElement('span');
      item.textContent=text;
      item.title=description;
      entry.append(item);
    }
    timerEl.append(entry);
    if(!animate||events.length===0){
      solution=result.solution;
      drawBoard();
      finishSolve(result.solution!==null);
      return;
    }
    solution=new Array(cellClues.length).fill(-1);
    statusEl.textContent='Animating...';
    let index=0;
    function playNext(){
      if(currentRun!==runId) return;
      if(index===events.length){
        animationMove=null;
        solution=result.solution;
        drawBoard();
        finishSolve(result.solution!==null);
        return;
      }
      const event=events[index++];
      solution[event.pos]=event.value;
      animationMove=event;
      const action=event.kind==='forced'?'Forced placement':event.kind==='guess'?'Guess':'Backtrack';
      statusEl.textContent=`${action}: row ${Math.floor(event.pos/COLS)+1}, column ${event.pos%COLS+1} (${index}/${events.length})`;
      drawBoard();
      // Keep one playback timer pending, even for a long search trace.
      schedule(playNext,Number(animationSpeed.value)||200);
    }
    schedule(playNext,0);
  },0);
});

document.getElementById('clearSolutionBtn').addEventListener('click', clearSolution);

// Clear the entire Build setup.
document.getElementById('clearBtn').addEventListener('click', ()=>{
  eqEdges.clear();
  diffEdges.clear();
  cellClues.fill(-1);
  clearSolution();
  document.getElementById('buildStatus').textContent='Cleared';
});

function changeSize(){
  COLS=parseInt(colsInp.value,10);
  ROWS=parseInt(rowsInp.value,10);
  resizeCanvas();
  eqEdges.clear();
  diffEdges.clear();
  cellClues=new Array(ROWS*COLS).fill(-1);
  clearSolution();
}
colsInp.addEventListener('change', changeSize);
rowsInp.addEventListener('change', changeSize);

// tabs
document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>{
  if(btn.dataset.tab==='buildTab'){
    clearSolution();
    timerEl.replaceChildren();
  }
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(p=>p.classList.remove('active'));
  document.getElementById(btn.dataset.tab).classList.add('active');
  drawBoard();
}));

// init
drawBoard();
